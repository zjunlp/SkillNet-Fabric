[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillfabric-ai"
version = "0.1.0"
description = "Skill graph, query-wiki routing, and execution prompt orchestration for agent skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "SkillFabric Contributors" }
]
keywords = ["agents", "skills", "routing", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "graspologic>=3.4.4; python_version < '3.13'",
  "litellm>=1.63.8",
  "networkx>=3.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
claude = [
  "claude-agent-sdk>=0.1.50",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
]
all = [
  "claude-agent-sdk>=0.1.50",
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
skillfabric = "skillfabric.cli:main"

[project.urls]
Homepage = "https://github.com/SkillFabric/skillfabric"
Source = "https://github.com/SkillFabric/skillfabric"
Issues = "https://github.com/SkillFabric/skillfabric/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/skillfabric"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/src",
  "/tests",
]
exclude = [
  "/.env",
  "/.env.*",
  "/models",
  "/runs",
  "/experiments",
  "/__pycache__",
  "**/__pycache__",
  "*.pyc",
  "**/*.pyc",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
