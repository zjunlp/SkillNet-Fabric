[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillfabric-ai"
version = "0.1.0"
description = "Skill graph, task specific Wiki routing, and execution prompt orchestration for agent skills."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "SkillFabric Contributors" }
]
keywords = ["agents", "skills", "routing", "claude-code", "codex"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.28,<1.0",
  "litellm>=1.63.8,<2",
  "numpy>=1.26,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
claude = [
  "claude-agent-sdk>=0.2.110,<0.3",
]
codex = [
  "openai-codex>=0.144.4,<0.2",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.0,<10",
  "ruff>=0.8,<1",
  "tomli>=2.0; python_version < '3.11'",
]
all = [
  "claude-agent-sdk>=0.2.110,<0.3",
  "openai-codex>=0.144.4,<0.2",
]

[project.scripts]
skillfabric = "skillfabric.cli:main"

[project.urls]
Homepage = "https://github.com/zjunlp/SkillNet-Fabric"
Source = "https://github.com/zjunlp/SkillNet-Fabric"
Issues = "https://github.com/zjunlp/SkillNet-Fabric/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/skillfabric"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/src",
  "/tests",
]
exclude = [
  "/.env",
  "/.env.*",
  "/models",
  "/runs",
  "/experiments",
  "/__pycache__",
  "**/__pycache__",
  "*.pyc",
  "**/*.pyc",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ARG", "B", "BLE", "C4", "E", "F", "I", "PERF", "PIE", "RET", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
