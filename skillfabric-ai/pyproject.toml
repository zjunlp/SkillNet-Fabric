[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillfabric-ai"
version = "0.1.0"
description = "Skill graph, query-wiki routing, and execution prompt orchestration for agent skills."
readme = { text = "SkillFabric compiles native agent skills into an evidence-grounded graph, routes each task through a bounded query wiki, and produces a validated execution prompt. See the project homepage for complete documentation.", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "SkillFabric Contributors" }
]
keywords = ["agents", "skills", "routing", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.28,<1.0",
  "litellm>=1.63.8",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
claude = [
  "claude-agent-sdk>=0.2.110",
]
codex = [
  "openai-codex>=0.144.4,<0.145",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
]
all = [
  "claude-agent-sdk>=0.2.110",
  "openai-codex>=0.144.4,<0.145",
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
skillfabric = "skillfabric.cli:main"

[project.urls]
Homepage = "https://github.com/zjunlp/SkillNet-Fabric"
Source = "https://github.com/zjunlp/SkillNet-Fabric"
Issues = "https://github.com/zjunlp/SkillNet-Fabric/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/skillfabric"]

[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml",
  "/src",
  "/tests",
]
exclude = [
  "/.env",
  "/.env.*",
  "/models",
  "/runs",
  "/experiments",
  "/__pycache__",
  "**/__pycache__",
  "*.pyc",
  "**/*.pyc",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ARG", "B", "BLE", "C4", "E", "F", "I", "PERF", "PIE", "RET", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
